<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join LearnHub to discover courses, manage assignments, and keep learning.">
    <title>LearnHub | Welcome</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main class="auth-card" id="auth-card">

        <section class="form-panel register-panel" id="register-panel" aria-labelledby="register-heading">
            <a class="brand" href="./index.html" aria-label="LearnHub home">
                <span class="brand-mark" aria-hidden="true">LH</span>
                <span class="brand-name">LearnHub<span class="brand-dot">.</span></span>
            </a>

            <div class="form-heading">
                <h1 id="register-heading">Create your account</h1>
            </div>
            <form id="register-form" method="post" novalidate>
                <div class="name-row">
                    <div class="form-field">

                        <label for="first-name">First name</label>
                        <input
                            type="text"
                            id="first-name"
                            name="firstName"
                            autocomplete="given-name"
                            placeholder="First name"

                        >
                    </div>
                    <div class="form-field">
                        <label for="last-name">Last name</label>
                        <input
                            type="text"
                            id="last-name"
                            name="lastName"
                            autocomplete="family-name"
                            placeholder="Last name"

                        >
                    </div>
                </div>

                <div class="form-field">
                    <label for="register-email">Email address</label>
                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"

                    >
                </div>

                <div class="form-field">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                    >
                </div>

                <div class="form-field">
                    <label for="register-role">Role</label>
                    <select id="register-role" name="role">
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                    </select>
                </div>

                <button type="submit" class="primary-button" id="register-button">
                    Create account
                </button>
                <p class="form-message" id="register-message" role="status" aria-live="polite"></p>
            </form>

            <p class="switch-text">
                Already have an account?
                <button type="button" id="show-login" class="text-button">Log in</button>
            </p>
        </section>

        <section class="form-panel login-panel" id="login-panel" aria-labelledby="login-heading">
            <a class="brand" href="./index.html" aria-label="LearnHub home">
                <span class="brand-mark" aria-hidden="true">LH</span>
                <span class="brand-name">LearnHub<span class="brand-dot">.</span></span>
            </a>

            <div class="form-heading">
                <h2 id="login-heading">Log in</h2>
            </div>

            <form id="login-form" method="post" novalidate>
                <div class="form-field">
                    <label for="login-email">Email address</label>
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                    >
                </div>

                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                    >
                </div>

                <button type="submit" class="primary-button" id="login-button">
                    Log in
                </button>
                <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
            </form>

            <p class="switch-text">
                New to LearnHub?
                <button type="button" id="show-register" class="text-button">Create an account</button>
            </p>
        </section>

    </main>

    <script type="module" src="./js/script.js"></script>
</body>

</html>
